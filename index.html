<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3f1ee">

    <title>Martins Barbearia</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231c1c1c'/><text x='50' y='67' font-size='54' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>M</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         LOGIN
         ===================================================== -->
    <div id="telaLogin" class="tela-login">

        <div class="login-caixa">

            <h1>MARTINS BARBEARIA</h1>
            <p class="login-subtitulo">Acesso ao sistema</p>

            <label for="loginTipo">Entrar como</label>
            <select id="loginTipo">
                <option value="barbeiro">Barbeiro</option>
                <option value="dono">Dono</option>
            </select>

            <div id="loginCampoBarbeiro">
                <label for="loginBarbeiro">Barbeiro</label>
                <select id="loginBarbeiro"></select>
            </div>

            <label for="loginSenha">Senha</label>
            <input type="password" id="loginSenha" placeholder="Digite a senha">

            <button class="botao-principal" id="btnEntrar">Entrar</button>

            <p id="loginErro" class="login-erro"></p>

        </div>

    </div>


    <!-- =====================================================
         APP
         ===================================================== -->
    <div id="appPrincipal" style="display:none;">

        <main>

            <!-- Todas as telas (Home, Serviços, Clientes, Conta...)
                 são desenhadas aqui dentro pelo app.js -->
            <section class="conteudo">
                <div id="app"></div>
            </section>

        </main>

        <!-- Menu inferior: 4 abas, como no modelo.
             Barbeiros e Financeiro agora abrem pelos atalhos da Home. -->
        <nav class="menu-inferior">

            <button id="menuHome">
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10v9.5h13V10"/></svg></span>
                <small>Home</small>
            </button>

            <button id="menuServicos">
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h2M10 7h9M5 12h2M10 12h9M5 17h2M10 17h9"/></svg></span>
                <small>Serviços</small>
            </button>

            <button id="menuClientes">
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.2"/><path d="M6 20c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></svg></span>
                <small>Clientes</small>
            </button>

            <button id="menuConta">
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.2"/><path d="M6 20c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></svg></span>
                <small>Conta</small>
            </button>

        </nav>

    </div>

    <script src="app.js"></script>
<!-- GitHub Pages -->
</body>

</html>
